IMC.ROS_BASIC_HINT_PACKAGENAME_DESC_P1=Specify the ROS 2 package name.  
IMC.ROS_BASIC_HINT_PACKAGENAME_DESC_P2=It must start with a lowercase letter and can contain only lowercase letters, numbers, and underscores.
IMC.ROS_BASIC_HINT_NODE_NAME_DESC_P1=Specify the ROS 2 node name. 
IMC.ROS_BASIC_HINT_NODE_NAME_DESC_P2=If the class name is left blank, the class name will be automatically generated from this value. 
IMC.ROS_BASIC_HINT_CLASS_NAME_DESC_P1=Specify the Node class name used in the generated code. 
IMC.ROS_BASIC_HINT_CLASS_NAME_DESC_P2=If left blank, it will be automatically generated from the node name. 
IMC.ROS_BASIC_HINT_DESCRIPTION_DESC_P1=Enter a brief description of the functions provided by the package or node. 
IMC.ROS_BASIC_HINT_DESCRIPTION_DESC_P2=This will be used as description information in the ROS Profile and package.xml. 
IMC.ROS_BASIC_HINT_VERSION_DESC=Specify the package version. Enter it in a format such as 0.0.1. 
IMC.ROS_BASIC_HINT_MAINTAINER_DESC=Specify the maintainer name to be recorded in package.xml.
IMC.ROS_BASIC_HINT_CATEGORY_DESC_P1=Select the usage category of the node.  
IMC.ROS_BASIC_HINT_CATEGORY_DESC_P2=This information will be saved as classification information in the ROS Profile.
  
IMC.ROS_BASIC_HINT_LICENSR_DESC_P1=Select the license that defines the conditions for using, modifying,
IMC.ROS_BASIC_HINT_LICENSR_DESC_P2=and redistributing the generated ROS 2 package.
IMC.ROS_BASIC_HINT_LICENSR_DESC_P3= The license name will be recorded in package.xml and Python setup.py,
IMC.ROS_BASIC_HINT_LICENSR_DESC_P4= and a LICENSE file will also be generated directly under the package.
IMC.ROS_BASIC_HINT_LICENSR_DESC_P5=If you are unsure, Apache-2.0 is recommended. GPL-3.0 and LGPL-3.0 have copyleft characteristics,  
IMC.ROS_BASIC_HINT_LICENSR_DESC_P6=so caution is required for joint research and corporate use.  
IMC.ROS_BASIC_HINT_LICENSR_DESC_P7=If Proprietary is selected,
IMC.ROS_BASIC_HINT_LICENSR_DESC_P8=a simple All rights reserved statement will be generated instead of a standard OSS license.
IMC.ROS_BASIC_HINT_LICENSR_DESC_P9=If an official rights statement is required,  
IMC.ROS_BASIC_HINT_LICENSR_DESC_P10=replace the LICENSE text according to your organization or joint research agreement.  
IMC.ROS_BASIC_HINT_MAINTAINER_MAIL_DESC=Specify the maintainer email address to be recorded in package.xml.

IMC.ROS_BASIC_HINT_DEPENDENCY_DESC_P1=Enter the dependency package name to be added to the generated package.xml
IMC.ROS_BASIC_HINT_DEPENDENCY_DESC_P2=and CMakeLists.txt. Example: cv_bridge.

IMC.ROS_BASIC_HINT_LANGUAGE_DESC_P1=Select the implementation language of the ROS 2 package to be generated.  
IMC.ROS_BASIC_HINT_LANGUAGE_DESC_P2=C++ is treated as ament_cmake, and Python is treated as ament_python.  

IMC.ROS_BASIC_HINT_GENERATE_DESC_P1=Generate a complete ROS 2 node template from the current GUI input values.
IMC.ROS_BASIC_HINT_GENERATE_DESC_P2=If there are input errors, they will be displayed before generation.

