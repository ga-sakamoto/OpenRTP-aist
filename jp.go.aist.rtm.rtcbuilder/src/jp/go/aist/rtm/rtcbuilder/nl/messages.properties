IMC.ROS_TOPIC_HINT_MESSAGE_TYPE_DESC_P2=You can select from the type candidate configuration file or imported custom .msg files.
IMC.ROS_TOPIC_HINT_QoS_TITLE=QoS\u3000:
IMC.ROS_TOPIC_HINT_QoS_DESC=ROS 2\u306e\u901a\u4fe1\u54c1\u8cea\u8a2d\u5b9a\u3067\u3059\u3002\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u306e\u72b6\u614b\u3084\u7528\u9014\u306b\u5408\u308f\u305b\u3066\u8a2d\u5b9a\u3057\u307e\u3059\u3002
IMC.ROS_TOPIC_HINT_RELIABILITY_TITLE=- Reliability :
IMC.ROS_TOPIC_HINT_RELIABILITY_DESC_P1=Specify the communication reliability. Reliable prioritizes message delivery,
IMC.ROS_TOPIC_HINT_RELIABILITY_DESC_P2=while Best Effort allows some message loss and prioritizes low latency.
IMC.ROS_TOPIC_HINT_RELIABILITY_DESC_P3= The default value is Reliable.
IMC.ROS_TOPIC_HINT_HISTORY_TITLE=- History :
IMC.ROS_TOPIC_HINT_HISTORY_DESC_P1=Specify how message history is stored.
IMC.ROS_TOPIC_HINT_HISTORY_DESC_P2=Keep Last keeps the latest N messages, while Keep All stores as much history as possible.
IMC.ROS_TOPIC_HINT_HISTORY_DESC_P3=The default value is Keep Last.
IMC.ROS_TOPIC_HINT_DEPTH_TITLE=- Depth :
IMC.ROS_TOPIC_HINT_DEPTH_DESC_P1=This is the number of messages to keep when History is set to Keep Last.
IMC.ROS_TOPIC_HINT_DEPTH_DESC_P2=It is generally not used when Keep All is selected.
IMC.ROS_TOPIC_HINT_VARNAME_SUBSCRIBE_TITLE=- Subscribe:
IMC.ROS_TOPIC_HINT_VARNAME_SUBSCRIBE_DESC_P1=Specify the function name to be called when a Subscribe Topic receives a message.
IMC.ROS_TOPIC_HINT_VARNAME_SUBSCRIBE_DESC_P2=If left blank, it will be automatically completed from the Topic name.
IMC.ROS_TOPIC_HINT_VARNAME_PUBLISH_TITLE=- Publish:
IMC.ROS_TOPIC_HINT_VARNAME_PUBLISH_DESC_P1=Specify the Publisher variable name used for a Publish Topic.
IMC.ROS_TOPIC_HINT_VARNAME_PUBLISH_DESC_P2=If left blank, it will be automatically completed from the Topic name.

IMC.ROS_TOPIC_HINT_DOC_OVERVIEW_P1=Briefly describe the purpose or role of the Topic.
IMC.ROS_TOPIC_HINT_DOC_OVERVIEW_P2=This will be saved as Documentation information in the ROS Profile.
IMC.ROS_TOPIC_HINT_DOC_DETAIL=Describe details such as the data content, usage conditions, and notes for the Topic.
IMC.ROS_TOPIC_HINT_DOC_DATATYPE=\u30c8\u30d4\u30c3\u30af\u306e\u30c7\u30fc\u30bf\u578b\u3092\u8a18\u8f09\u3002
IMC.ROS_TOPIC_HINT_DOC_UNIT_P1=Describe the unit of the values handled by the Topic.
IMC.ROS_TOPIC_HINT_DOC_UNIT_P2=Examples: m/s, rad. Leave this blank if there is no unit.
IMC.ROS_TOPIC_HINT_DOC_OCCUR_P1=Describe the expected frequency at which the Topic is published or subscribed.
IMC.ROS_TOPIC_HINT_DOC_OCCUR_P2=Examples: 10 Hz, when an event occurs.

