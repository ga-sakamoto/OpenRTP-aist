IMC.ROS_LIFECYCLE_LBL_TIMER=Timer :
IMC.ROS_LIFECYCLE_HINT_TIMER_DESC_P1=Timers are treated as periodic processes under the Lifecycle Node. Multiple Timers can be defined.
IMC.ROS_LIFECYCLE_HINT_TIMER_DESC_P2=In the generated code, they are expected to be created in on_configure, started in on_activate, and stopped in on_deactivate.
IMC.ROS_LIFECYCLE_LBL_TIMER_NAME=Timer Name :
IMC.ROS_LIFECYCLE_HINT_TIMER_NAME_DESC_P1=Specify a name to identify the periodic execution process.
IMC.ROS_LIFECYCLE_HINT_TIMER_NAME_DESC_P2=Use an easy-to-distinguish name when defining multiple Timers.
IMC.ROS_LIFECYCLE_LBL_TIMER_RATE=Rate :
IMC.ROS_LIFECYCLE_HINT_TIMER_RATE_DESC=Specify the execution period of the Timer callback in seconds. Examples: 0.1, 1.0.
IMC.ROS_LIFECYCLE_LBL_TIMER_CALLBACK=\u30b3\u30fc\u30eb\u30d0\u30c3\u30af\u95a2\u6570\u540d :
IMC.ROS_LIFECYCLE_HINT_TIMER_CALLBACK_DESC_P1=Specify the function name to be called at each Timer period.
IMC.ROS_LIFECYCLE_HINT_TIMER_CALLBACK_DESC_P2=This will be used as the Timer callback function name in the generated code.
IMC.ROS_LIFECYCLE_LBL_TIMER_DESC=Description :
IMC.ROS_LIFECYCLE_HINT_TIMER_DESC_P1=Describe what process the Timer calls and at what period.
IMC.ROS_LIFECYCLE_HINT_TIMER_DESC_P2=This description is also reflected in comments in the generated code.

