IMC.ROS_LIFECYCLE_LBL_CALLBACK=\u30b3\u30fc\u30eb\u30d0\u30c3\u30af\u95a2\u6570\u540d :
IMC.ROS_LIFECYCLE_HINT_ON_CONFIGURE_DESC_P1=This callback performs the configuration process of the Lifecycle Node. It is always generated. 
IMC.ROS_LIFECYCLE_HINT_ON_CONFIGURE_DESC_P2=Initialization processes for Publisher, Subscriber, Service, Action, Timer, and other elements are placed here.
IMC.ROS_LIFECYCLE_HINT_ON_ACTIVATE_DESC_P1=This callback transitions the Lifecycle Node to the Active state. It is always generated. 
IMC.ROS_LIFECYCLE_HINT_ON_ACTIVATE_DESC_P2=Processes such as enabling Publishers and starting Timers are placed here.
IMC.ROS_LIFECYCLE_HINT_ON_DEACTIVATE_DESC_P1=This callback returns the Lifecycle Node to the Inactive state. It is always generated. 
IMC.ROS_LIFECYCLE_HINT_ON_DEACTIVATE_DESC_P2=Processes such as disabling Publishers and stopping Timers are placed here.
IMC.ROS_LIFECYCLE_HINT_ON_CLEANUP_DESC_P1=Specify whether to include resource cleanup processing
IMC.ROS_LIFECYCLE_HINT_ON_CLEANUP_DESC_P2=for returning from the Inactive state to the Unconfigured state.
IMC.ROS_LIFECYCLE_HINT_ON_CLEANUP_DESC_P3=Even if not selected, a commented-out template will be generated.
IMC.ROS_LIFECYCLE_HINT_ON_SHUTDOWN_DESC_P1=Specify whether to include termination processing for the Shutdown transition.
IMC.ROS_LIFECYCLE_HINT_ON_SHUTDOWN_DESC_P2=Even if not selected, a commented-out template will be generated.
IMC.ROS_LIFECYCLE_HINT_ON_ERROR_DESC_P1=Specify whether to include processing for recovery, logging, safe stop,
IMC.ROS_LIFECYCLE_HINT_ON_ERROR_DESC_P2=and other actions during an Error transition.
IMC.ROS_LIFECYCLE_HINT_ON_ERROR_DESC_P3=Even if not selected, a commented-out template will be generated.\u3002

