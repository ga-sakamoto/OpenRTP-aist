IMC.HINT_ROS_TITLE=Hint(ROS)
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P1=When Topic communication is used, the settings are configured in this section.
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P2=Topic communication is a communication method for transmitting and receiving data asynchronously
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P3= and continuously between nodes.
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P4=A node that sends data is called a Publisher, and a node that receives data is called a Subscriber.
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P5=For a Publisher and a Subscriber to communicate,
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P6=they must use the same Topic name and the same message type.
IMC.DATAPORT_HINT_DATAPORT_DESC_ROS_P7=If they do not match, the communication will not be performed.

IMC.DATAPORT_HINT_INPORT_DESC_ROS_P1=In Topic communication, if the communication method is Subscriber, the settings are configured in this section.
IMC.DATAPORT_HINT_INPORT_DESC_ROS_P2=It receives data transmitted from a Publisher that has the same Topic name and a matching message type.

IMC.DATAPORT_HINT_OUTPORT_DESC_ROS_P1=In Topic communication, if the communication method is Publisher, the settings are configured in this section.
IMC.DATAPORT_HINT_OUTPORT_DESC_ROS_P2=It publishes data to Subscribers that have the same Topic name and a matching message type.

IMC.DATAPORT_HINT_PORTNAME_DESC_ROS_P1=Enter the Topic name used in Topic communication.
IMC.DATAPORT_HINT_PORTNAME_DESC_ROS_P2=The Topic name is an identifier used to distinguish communication channels within the ROS system.
IMC.DATAPORT_HINT_PORTNAME_DESC_ROS_P3=Alphanumeric characters (A\u2013Z, a\u2013z, 0\u20139), underscores (_), and slashes (/) can be used.
IMC.DATAPORT_HINT_PORTNAME_DESC_ROS_P4=Spaces and special characters cannot be used.

IMC.DATAPORT_HINT_DATATYPE_DESC_ROS_P1=Select the message type (Node::\u25cb\u25cb) exchanged in Topic communication from the pull-down menu.
IMC.DATAPORT_HINT_DATATYPE_DESC_ROS_P2= For a Publisher and a Subscriber to communicate, the same Topic name and message type must be specified.
IMC.DATAPORT_HINT_DATATYPE_DESC_ROS_P3= In addition to the basic types provided by the tool, custom message types can also be used.
IMC.DATAPORT_HINT_DATATYPE_DESC_ROS_P4= When using a custom data type, convert the corresponding .msg file into an IDL file,
IMC.DATAPORT_HINT_DATATYPE_DESC_ROS_P5= copy it into the project\u2019s IDL folder, and then press the Reload button to make it appear in the selection list.

IMC.SERVIVEPORT_HINT_PORT_DESC_ROS_P1=When Service communication is used, the settings are configured in this section.
IMC.SERVIVEPORT_HINT_PORT_DESC_ROS_P2=Service communication is a communication method for performing request/response-type synchronous
IMC.SERVIVEPORT_HINT_PORT_DESC_ROS_P3=communication between nodes.
IMC.SERVIVEPORT_HINT_PORT_DESC_ROS_P4=A Service Client sends a request, and a Service Server returns the processing result as a response.
IMC.SERVIVEPORT_HINT_PORT_DESC_ROS_P5=To establish communication, the Service name and Service type must match.
IMC.SERVIVEPORT_HINT_PORT_DESC_ROS_P6=If either does not match, communication will not be performed.

IMC.SERVIVEPORT_HINT_PORT_NAME_DESC_ROS_P1=Enter the Service name used in Service communication.
IMC.SERVIVEPORT_HINT_PORT_NAME_DESC_ROS_P2=The Service name is an identifier used to distinguish communication channels within the ROS system.
IMC.SERVIVEPORT_HINT_PORT_NAME_DESC_ROS_P3=Alphanumeric characters (A\u2013Z, a\u2013z, 0\u20139), underscores (_), and slashes (/) can be used in the Service name.
IMC.SERVIVEPORT_HINT_PORT_NAME_DESC_ROS_P4=Spaces and special characters cannot be used.

IMC.SERVIVEPORT_HINT_IF_NAME_DESC_ROS=Enter the Service name that was specified as the port name.

IMC.SERVIVEPORT_HINT_IF_DIRECTION_DESC_ROS_P1=Select the role used in Service communication.
