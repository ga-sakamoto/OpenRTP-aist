IMC.FSM_HINT_DESC_P1=Click the checkbox if you create a FSM (Finite State Machine) type component.
IMC.FSM_HINT_DESC_P2=FSM-Components have two types as follows.
IMC.FSM_STATIC_HINT_DESC_P1=Static FSM component.
IMC.FSM_STATIC_HINT_DESC_P2=This type defines FSM structure statically in the source code.
IMC.FSM_STATIC_HINT_DESC_P3=After compilation (after execution in Python component),
IMC.FSM_STATIC_HINT_DESC_P4=the FSM structure cannot be changed.
IMC.FSM_STATIC_HINT_DESC_P5=If you need a compact and closed FSM component, please this type.
IMC.FSM_DYNAMIC_HINT_DESC_P1=Dynamic FSM component.
IMC.FSM_DYNAMIC_HINT_DESC_P2=This component can be changed the FSM structure.
IMC.FSM_DYNAMIC_HINT_DESC_P3=This type realizes one-state as one-component (FSM participant), and its behavior
IMC.FSM_DYNAMIC_HINT_DESC_P4=can be changed in runtime giving its structure including number of state
IMC.FSM_DYNAMIC_HINT_DESC_P5=and its relation with transition event and condition. However, its size becomes bigger.
IMC.FSM_SCXML_HINT_DESC=FSM structure is described with SXCML (State Chart XML, W3C standard).

IMC.FSM_HINT_PROC=FSM design procedure
IMC.FSM_HINT_PROC_1=1.Create one event port per FSM.
IMC.FSM_HINT_PROC_2=2.Design state transitions in the FSM editor.
IMC.FSM_HINT_PROC_2_1=- Create the required state.
IMC.FSM_HINT_PROC_2_2=- Create transitions between states.
IMC.FSM_HINT_PROC_2_3=- Define an event that causes a transition.
IMC.FSM_HINT_PROC_3=3.Events and event handlers.
IMC.FSM_HINT_PROC_3_1=- An event occurs when data is received at the event port.
IMC.FSM_HINT_PROC_3_2=- Events are distinguished by name.
IMC.FSM_HINT_PROC_3_3=- Events are handled by event handlers.
IMC.FSM_HINT_PROC_3_4=- Event handler receives data for event port as 0 or 1 argument.

IMC.FSM_HINT_EVENT_PORT=Event Port
IMC.FSM_HINT_PORT_NAME_TITLE=Port name:
IMC.FSM_HINT_PORT_NAME_DESC_1=The name of the event port that receives the event (such as the state transition name).
IMC.FSM_HINT_PORT_NAME_DESC_2=One event port corresponds to one state transition.
IMC.FSM_HINT_VAR_NAME_TITLE=Variable name:
IMC.FSM_HINT_VAR_NAME_DESC=Option.If not filled in, the port name is used.
IMC.FSM_HINT_EVENT_LIST=Event list
IMC.FSM_HINT_EVENT_NAME_TITLE=Event name:
IMC.FSM_HINT_EVENT_NAME_DESC=The name of the event.Used for mapping when connecting event ports to OutPort.
IMC.FSM_HINT_DATA_TYPE_TITLE=Data type:
IMC.FSM_HINT_DATA_TYPE_DESC=Corresponding event data type when connecting to OutPort.
IMC.FSM_HINT_SOURCE_TITLE=Source state:
IMC.FSM_HINT_SOURCE_DESC_1=Transition source state name.
IMC.FSM_HINT_SOURCE_DESC_2=The event handler is implemented as a subclass method corresponding to this state.
IMC.FSM_HINT_TARGET_TITLE=Target state:
IMC.FSM_HINT_TARGET_DESC_1=Transition destination state name.
IMC.FSM_HINT_TARGET_DESC_2=In the event handler, a function that transitions to this state is called.
IMC.FSM_HINT_DOC_DESC_DESC=Describes the event and the transition that occurs.
IMC.FSM_HINT_DOC_TYPE_DESC=Describes the data type that the event handler processes.
IMC.FSM_HINT_DOC_NUM_DESC=Describes the number of data when the data type processed by the event handler is array.
IMC.FSM_HINT_DOC_DETAIL_DESC_1=Detailed description about the event, pre-conditions, post-conditions,
IMC.FSM_HINT_DOC_DETAIL_DESC_2=relations between states before and after transition.
IMC.FSM_HINT_DOC_UNIT_DESC=A unit of data processed by an event handler.
IMC.FSM_HINT_DOC_OPE_DESC=Describes the data reception frequency and cycle assumed by the event port.

